server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: befine-saas-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/befine_saas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:23022006}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

app:
  jwt:
    secret: ${JWT_SECRET:befine-saas-secret-key-must-be-at-least-32-bytes-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  seed-file: ${SEED_FILE:classpath:seed-data.json}

logging:
  file:
    name: ${LOG_FILE:./logs/befine-saas.log}
  level:
    root: INFO
    vn.befine.saas: INFO
